<!DOCTYPE html>
<html>
<head>
    <title>AgroQuick Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .login-box {
            width: 320px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🌾 AgroQuick</h1>

        <h2>Login</h2>

        <form action="/login" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Continue</button>

        </form>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

    </div>

</body>
</html>
