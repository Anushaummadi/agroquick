<!DOCTYPE html>
<html>
<head>
    <title>AgroQuick - Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f8f2;
        }

        header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .search-box {
            text-align: center;
            padding: 30px 20px 10px;
        }

        .search-box form {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-box input {
            width: 300px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-box button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .product {
            background: white;
            width: 230px;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        .product h2 {
            color: #2e7d32;
        }

        .product a {
            display: inline-block;
            background: #2e7d32;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
        }

        .buttons {
            text-align: center;
            margin: 20px;
        }

        .buttons a {
            background: #ff9800;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<!-- AgroQuick Search Page -->

<header>
    <h1>🔎 AgroQuick Search</h1>
</header>

<div class="search-box">

    <form action="/search" method="GET">

        <input
            type="text"
            name="query"
            placeholder="Search Seeds, Fertilizer, Urea..."
            value="{{ query or '' }}"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

</div>

{% if results %}

<div class="results">

    {% for product in results %}

    <div class="product">

        <h2>{{ product.name }}</h2>

        <p>Category: {{ product.category }}</p>

        <h3>₹{{ product.price }}</h3>

        <a href="{{ product.url }}">
            View Product
        </a>

    </div>

    {% endfor %}

</div>

{% elif query %}

<div style="text-align:center; padding:40px;">

    <h2>😔 No products found</h2>

    <p>Try searching for Seeds, Urea, Fertilizer or Water Pump.</p>

</div>

{% endif %}

<div class="buttons">

    <a href="/">🏠 Home</a>

    <a href="/cart">🛒 Cart</a>

</div>

</body>
</html>
